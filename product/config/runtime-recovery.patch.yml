# Product built-in runtime policy loaded as a final profile overlay.
- id: llm-pi-ai
  config:
    providers:
      opencode-go:
        streamIdleTimeoutMs: 300000
        retryPolicy:
          mode: normal
          maxRetries: 3
          retryableCodes:
            - EMPTY_RESPONSE
            - RATE_LIMIT
            - SERVER
            - TIMEOUT
            - TRANSPORT
          backoff:
            initialDelayMs: 500
            maxDelayMs: 10000
            jitterRatio: 0.1

# Apply the same terminal policy to the native DeepSeek adapter.
- id: llm-deepseek
  config:
    streamIdleTimeoutMs: 300000
    retryPolicy:
      mode: normal
      maxRetries: 3
      retryableCodes:
        - EMPTY_RESPONSE
        - RATE_LIMIT
        - SERVER
        - TIMEOUT
        - TRANSPORT
      backoff:
        initialDelayMs: 500
        maxDelayMs: 10000
        jitterRatio: 0.1

